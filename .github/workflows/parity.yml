name: parity
on:
  push:
  pull_request:
jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Kieliversioiden rakennepariteetti (fi = lähde)
        run: python3 scripts/parity.py --strict
      - name: Sisäiset linkit ja ankkurit
        run: python3 scripts/linkcheck.py --internal-only
